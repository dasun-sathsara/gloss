[project]
name = "gloss"
version = "0.1.10"
description = "English vocabulary flashcards with Sinhala meanings and audio for Anki."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dasun Sathasara"}]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162.2,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.16.2,<3", "google-genai>=3.0.0,<4",
  "imageio-ffmpeg>=0.8.1,<1", "json-repair>=0.64.8,<1", "filelock>=4.2.10,<5",
  "numpy>=1.24,<3",
]

[project.scripts]
gloss = "gloss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/dasun-sathsara/gloss"
Issues = "https://github.com/dasun-sathsara/gloss/issues"

[tool.hatch.build]
exclude = ["src/gloss/assets/fonts/_StudioFeixenSansVariable.ttf", "frontend/public/_StudioFeixenSansVariable.ttf"]

[tool.hatch.build.targets.wheel]
packages = ["src/gloss"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-asyncio>=1.4.1.post1,<2", "respx>=0.22,<1", "ruff>=0.17.4,<1", "ty==0.0.100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
